<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Hexagon outer -->
  <polygon points="24,2 44,13 44,35 24,46 4,35 4,13" stroke="url(#lg1)" stroke-width="1.5" fill="none" filter="url(#glow)" opacity="0.9"/>
  <!-- Inner hex smaller -->
  <polygon points="24,9 38,17 38,31 24,39 10,31 10,17" stroke="url(#lg1)" stroke-width="0.8" fill="none" opacity="0.4"/>
  <!-- Central node -->
  <circle cx="24" cy="24" r="3" fill="url(#lg1)" filter="url(#glow)"/>
  <!-- Spokes -->
  <line x1="24" y1="21" x2="24" y2="9"  stroke="url(#lg1)" stroke-width="1" opacity="0.8"/>
  <line x1="24" y1="27" x2="24" y2="39" stroke="url(#lg1)" stroke-width="1" opacity="0.8"/>
  <line x1="21.4" y1="22.5" x2="10" y2="17" stroke="url(#lg1)" stroke-width="1" opacity="0.8"/>
  <line x1="26.6" y1="25.5" x2="38" y2="31" stroke="url(#lg1)" stroke-width="1" opacity="0.8"/>
  <line x1="21.4" y1="25.5" x2="10" y2="31" stroke="url(#lg1)" stroke-width="1" opacity="0.8"/>
  <line x1="26.6" y1="22.5" x2="38" y2="17" stroke="url(#lg1)" stroke-width="1" opacity="0.8"/>
  <!-- Corner dots -->
  <circle cx="24" cy="9"  r="1.5" fill="#00e5ff" opacity="0.9"/>
  <circle cx="38" cy="17" r="1.5" fill="#a855f7" opacity="0.9"/>
  <circle cx="38" cy="31" r="1.5" fill="#00e5ff" opacity="0.9"/>
  <circle cx="24" cy="39" r="1.5" fill="#a855f7" opacity="0.9"/>
  <circle cx="10" cy="31" r="1.5" fill="#00e5ff" opacity="0.9"/>
  <circle cx="10" cy="17" r="1.5" fill="#a855f7" opacity="0.9"/>
</svg>
